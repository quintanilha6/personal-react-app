<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131418">
  <meta name="description" content="Joao Quintanilha - software developer portfolio, resume, projects, hobbies, and contact details.">
  <title>Joao Quintanilha</title>
  <link rel="icon" href="./public/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="mi-wrapper">
    <div class="mi-bglines" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <nav class="mi-header" id="site-nav">
      <button class="mi-header-toggler" id="nav-toggle" type="button" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="mi-header-inner">
        <div class="mi-header-image">
          <a href="#home" aria-label="Go to home">
            <img id="brand-image" src="./public/images/brand-image.jpg" alt="Joao Quintanilha portrait">
          </a>
        </div>
        <ul class="mi-header-menu">
          <li><a href="#home" data-page-link="home"><span>Home</span></a></li>
          <li><a href="#about" data-page-link="about"><span>About</span></a></li>
          <li><a href="#resume" data-page-link="resume"><span>Resume</span></a></li>
          <li><a href="#portfolios" data-page-link="portfolios"><span>Portfolios</span></a></li>
          <li><a href="#volunteering" data-page-link="volunteering"><span>Volunteering</span></a></li>
          <li><a href="#hobbies" data-page-link="hobbies"><span>Hobbies</span></a></li>
          <li><a href="#contact" data-page-link="contact"><span>Contact</span></a></li>
        </ul>
        <p class="mi-header-copyright"></p>
      </div>
    </nav>

    <main class="mi-main">
      <section class="page-section page-section-home is-active" id="home" data-page="home"></section>
      <section class="page-section" id="about" data-page="about"></section>
      <section class="page-section" id="resume" data-page="resume"></section>
      <section class="page-section" id="portfolios" data-page="portfolios"></section>
      <section class="page-section" id="volunteering" data-page="volunteering"></section>
      <section class="page-section" id="hobbies" data-page="hobbies"></section>
      <section class="page-section" id="contact" data-page="contact"></section>
    </main>
  </div>

  <div class="mi-lightbox" id="lightbox" aria-hidden="true">
    <button class="mi-lightbox-close" id="lightbox-close" type="button" aria-label="Close image viewer">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button class="mi-lightbox-nav mi-lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous image">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <img id="lightbox-image" src="" alt="">
    <button class="mi-lightbox-nav mi-lightbox-next" id="lightbox-next" type="button" aria-label="Next image">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <script src="./script.js"></script>
</body>
</html>
